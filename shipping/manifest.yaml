apiVersion: v1

kind: ConfigMap

metadata:
  name: shipping
  namespace: roboshop

data:
  CART_ENDPOINT: cart:8080
  DB_HOST: mysql

---
apiVersion: apps/v1

kind: Deployment

metadata:
  name: shipping
  namespace: roboshop

  # labels related to deployment resources
  labels:
    project: roboshop
    tier: backend
    component: shipping

spec:
  replicas: 1

  selector:
    matchLabels:
      project: roboshop
      tier: backend
      component: shipping

  # pod
  template:
    metadata:
      labels:
        project: roboshop
        tier: backend
        component: shipping

    spec:
      containers:
        - name: shipping
          image: joindevops/shipping:4.0.0
          ports: 
          - name: liveness-port
            containerPort: 8080
      startupProbe:
        httpGet:
        path: /health
        port: liveness-port
      failureThreshold: 12  # Try up to 30 times
      periodSeconds: 10     # Check every 10 seconds (Max 300s / 5 min total) 
      readinessProbe:
        httpGet:
        path: /health
        port: liveness-port
        periodSeconds: 10
      livenessProbe:
        httpGet:
        path: /health
        port: liveness-port
        periodSeconds: 10
      envFrom:
      - configMapRef:
          name: shipping

---
apiVersion: v1

kind: Service

metadata:
  name: shipping
  namespace: roboshop

  labels:
    project: roboshop
    tier: backend
    component: shipping

spec:
  selector:
    project: roboshop
    tier: backend
    component: shipping

  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080